<div class="crumbs"><a href="{{root}}">Главная</a> / <a href="{{root}}docs/">Документы</a> / {{code}}</div>
<article class="doc">
  <div class="doc-main">
    <div class="kind">{{kind}}</div>
    <h1>{{title}}</h1>
    {{subtitle}}
    <div class="actions">
      <a class="btn" href="{{pdf}}">Открыть PDF<small>{{size}}</small></a>
      {{post_btn}}
    </div>
    <table class="kv">{{kv}}</table>
    <h2>Аннотация</h2>
    {{about}}
    {{points}}
    {{limits}}
  </div>
  <aside class="doc-cover">
    <a href="{{pdf}}"><img src="cover.png" alt="Обложка {{code}}" width="460" height="651"></a>
    <div class="cap">{{pages}} · PDF</div>
  </aside>
</article>
