<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { display: flex; font-family: "PT Sans", sans-serif; color: #1d1d1b; -webkit-font-smoothing: antialiased; }
  .l { flex: 1; padding: 64px 56px 56px 72px; display: flex; flex-direction: column; border-left: 14px solid #2b5741; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 22px; letter-spacing: .3em; }
  .brand svg { width: 44px; height: 44px; }
  .kind { margin-top: auto; font-size: 20px; letter-spacing: .4em; text-transform: uppercase; color: #40403e; }
  h1 { font-size: {{title_size}}px; line-height: 1.14; text-transform: uppercase; margin: 16px 0 0; }
  .meta { margin-top: 26px; padding-top: 16px; border-top: 2px solid #1d1d1b; font-size: 22px; color: #40403e; display: flex; gap: 28px; }
  .meta .code { font-family: "PT Mono", monospace; color: #2b5741; }
  .r { width: 380px; background: #f3f3f1; display: flex; align-items: center; justify-content: center; }
  .r img { width: 300px; border: 1px solid #d9d9d6; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
</style></head>
<body>
  <div class="l">
    <div class="brand">{{logo}}<span>UBVPROJECT</span></div>
    <div class="kind">{{kind}}</div>
    <h1>{{title}}</h1>
    <div class="meta">{{meta}}</div>
  </div>
  {{right}}
</body></html>
