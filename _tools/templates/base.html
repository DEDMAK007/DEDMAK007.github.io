<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:site_name" content="UbVProject">
<meta property="og:locale" content="ru_RU">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{root}}assets/style.css">
</head>
<body>
<header class="site"><div class="wrap bar">
  <a class="brand" href="{{root}}">{{logo}}<span>UBVPROJECT</span></a>
  <nav><a href="{{root}}docs/" class="{{nav_docs}}">Документы</a><a href="{{tg_url}}" rel="noopener">Telegram ↗</a></nav>
</div></header>
<main class="wrap">
{{content}}
</main>
<footer class="site"><div class="wrap bar">
  <span>UbVProject · {{year}}</span>
  <a href="{{tg_url}}" rel="noopener">Telegram-канал {{tg_name}} ↗</a>
</div></footer>
</body>
</html>
